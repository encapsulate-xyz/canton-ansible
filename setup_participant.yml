---
- name: Set up canton participant node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [participant]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup environment
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run participant role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include participant role
          ansible.builtin.include_role:
            name: participant
            public: true

  post_tasks:
    - name: Verify participant
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ participant_log_file_path }}"
            # a new participant opens its ledger APIs only after the validator app initialises it, the metrics server opens at startup
            health_url: "http://localhost:{{ canton.participant.ports.metrics_port }}/-/healthy"
