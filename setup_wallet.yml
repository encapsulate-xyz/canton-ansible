---
- name: Set up canton Wallet UI
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [wallet]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/default.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup environment
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run wallet role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include wallet role
          ansible.builtin.include_role:
            name: wallet
            public: true

  post_tasks:
    - name: Verify wallet UI
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ wallet_log_file_path }}"
            health_url: "http://localhost:{{ canton.wallet.ports.listen_port }}/"
