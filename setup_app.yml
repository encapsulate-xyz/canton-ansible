---
- name: Set up canton validator app
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [app]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup environment
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run app role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include app role
          ansible.builtin.include_role:
            name: app
            public: true

  post_tasks:
    - name: Verify validator app
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ app_log_file_path }}"
            version_command: "env JAVA_HOME={{ java_home }} {{ app_bin_dir }}/{{ service_identifier }} --version"
            health_url: "http://localhost:{{ canton.app.ports.admin_port }}/api/validator/livez"
